<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <meta name='theme-color' content='#101820'>
  <title>Symmetry - train with intent</title>
  <style>
    :root { --bg:#101820; --panel:#18242b; --panel2:#223139; --line:#385057; --text:#f2f7f1; --muted:#9aa9a8; --green:#b8f35a; --gold:#d7b56d; color-scheme:dark; font-family:Inter,system-ui,sans-serif; }
    * { box-sizing:border-box; } body { margin:0; min-width:320px; min-height:100vh; color:var(--text); background:radial-gradient(circle at 90% 0,#23422e,transparent 34rem),var(--bg); line-height:1.5; }
    body.light { --bg:#f3f6f2; --panel:#fff; --panel2:#eaf1eb; --line:#d5e0d7; --text:#172019; --muted:#5d6c62; color-scheme:light; }
    button,input,select,textarea { font:inherit; } button { cursor:pointer; } button:hover { filter:brightness(1.08); }
    .app { max-width:1150px; margin:auto; padding:0 18px 105px; } .top { min-height:70px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); }
    .brand { border:0; background:none; color:inherit; font-weight:900; letter-spacing:.08em; display:flex; align-items:center; gap:9px; } .mark { display:grid; place-items:center; width:32px; height:32px; border-radius:10px; color:#102016; background:var(--green); }
    .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; } .grid { display:grid; gap:14px; } .two { grid-template-columns:repeat(2,minmax(0,1fr)); } .four { grid-template-columns:repeat(4,minmax(0,1fr)); }
    .page { padding:32px 0; animation:rise .25s ease; } @keyframes rise { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} } h1,h2,h3,p { margin-top:0; } h1 { max-width:700px; font-size:clamp(2.5rem,8vw,5.5rem); line-height:.95; letter-spacing:-.08em; } h2 { line-height:1; letter-spacing:-.05em; } .lead,.muted { color:var(--muted); } .lead { max-width:650px; font-size:1.08rem; }
    .eyebrow,.label { color:var(--green); text-transform:uppercase; letter-spacing:.15em; font-size:.7rem; font-weight:900; } .card { background:linear-gradient(145deg,var(--panel),var(--panel2)); border:1px solid var(--line); border-radius:18px; padding:19px; box-shadow:0 10px 35px #0004; } .accent { border-color:#b8f35a66; }
    .stat { min-height:110px; display:flex; flex-direction:column; justify-content:space-between; } .stat strong { font-size:2rem; } .stat small,.label { color:var(--muted); } .chip,.tag { border:1px solid var(--line); border-radius:99px; padding:6px 10px; color:var(--muted); background:transparent; font-size:.78rem; font-weight:800; } .chip.green,.tag.selected { color:#102016; background:var(--green); border-color:var(--green); }
    .primary,.secondary,.ghost { border:1px solid var(--line); border-radius:10px; padding:10px 14px; color:inherit; background:transparent; font-weight:800; } .primary { color:#102016; background:var(--green); border-color:var(--green); } .secondary { background:var(--panel2); } .ghost { border-color:transparent; color:var(--muted); }
    .section-head { margin:30px 0 14px; } .notice { padding:12px 14px; border-left:3px solid var(--green); background:#b8f35a12; color:var(--muted); } .form { display:grid; gap:12px; } .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; } .field { display:grid; gap:5px; } .field label { color:var(--muted); font-size:.78rem; font-weight:800; } .field input,.field select,.field textarea,.search { width:100%; border:1px solid var(--line); border-radius:9px; padding:10px; color:var(--text); background:var(--panel2); } textarea { min-height:105px; resize:vertical; }
    .tag-list { display:flex; gap:8px; flex-wrap:wrap; } .tag { cursor:pointer; } .tabs { display:flex; gap:8px; overflow:auto; } .tabs .active { color:#102016; background:var(--green); border-color:var(--green); }
    .weeks { display:grid; grid-template-columns:repeat(9,130px); gap:8px; overflow:auto; margin:12px 0; } .week { min-height:110px; padding:12px; text-align:left; color:inherit; background:var(--panel); border:1px solid var(--line); border-radius:12px; } .week.current { border-color:var(--green); } .week.done { background:#b8f35a18; }
    .exercise { display:grid; grid-template-columns:22px 1fr 52px 52px 65px auto; gap:7px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); } .exercise input { width:100%; min-width:0; padding:7px; color:inherit; background:var(--panel2); border:1px solid var(--line); border-radius:7px; } .exercise small { display:block; color:var(--muted); }
    .timer { color:var(--green); font-size:3.2rem; font-weight:900; line-height:1; } .bars { height:150px; display:flex; align-items:end; gap:7px; border-bottom:1px solid var(--line); } .bar { flex:1; height:var(--height); background:var(--green); border-radius:6px 6px 0 0; }
    .photos { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; } .photo { aspect-ratio:1; overflow:hidden; border:1px solid var(--line); border-radius:10px; } .photo img { width:100%; height:100%; object-fit:cover; } .list-row { display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
    .bottom { position:fixed; z-index:5; left:50%; bottom:13px; transform:translateX(-50%); width:min(760px,calc(100% - 24px)); display:grid; grid-template-columns:repeat(7,1fr); padding:6px; border:1px solid var(--line); border-radius:17px; background:#11161eee; backdrop-filter:blur(15px); } .bottom button { border:0; border-radius:10px; padding:6px 2px; color:var(--muted); background:transparent; font-size:.62rem; font-weight:800; } .bottom button span { display:block; font-size:1rem; } .bottom button.active { color:#102016; background:var(--green); }
    .toast { position:fixed; z-index:20; right:18px; bottom:90px; padding:12px 15px; border:1px solid var(--green); border-radius:10px; background:var(--panel); } .fatal { display:none; position:fixed; z-index:99; inset:12px; padding:16px; border:2px solid #ff7774; border-radius:12px; color:#fff; background:#531e22; white-space:pre-wrap; } .fatal.show { display:block; }
    @media(max-width:800px){.four{grid-template-columns:repeat(2,minmax(0,1fr))}} @media(max-width:600px){.app{padding:0 12px 100px}.two,.form-grid{grid-template-columns:1fr}.exercise{grid-template-columns:20px 1fr 48px 48px}.exercise button{grid-column:2}.bottom button{font-size:.55rem}}
  </style>
</head>
<body>
  <div id='fatal' class='fatal' role='alert'></div><div id='app' aria-live='polite'></div><div id='toast' class='toast' hidden></div>
  <script>
    (function () {
      'use strict';
      window.onerror = function (message, source, line, column, error) { showFatal(error && error.stack ? error.stack : String(message) + ' at ' + String(source || 'inline') + ':' + String(line || 0) + ':' + String(column || 0)); return false; };
      window.addEventListener('unhandledrejection', function (event) { showFatal(event && event.reason ? (event.reason.stack || event.reason.message || String(event.reason)) : 'Unhandled promise rejection'); });

      var MARKER = 'SYMMETRY_V7_CLEAN';
      var KEY = 'symmetry-v7-clean';
      var fallbackStore = {};
      var pages = [['home','⌂','Home'],['scan','◌','Scan'],['plan','▦','Plan'],['progress','↗','Progress'],['coach','✦','Coach'],['library','⌕','Library'],['settings','⚙','Settings']];
      var groups = ['Chest','Back','Shoulders','Arms','Core','Quads','Hamstrings','Glutes','Calves','Hip flexors','Grip','Mobility'];
      var goals = ['Muscle gain','Strength','Calisthenics','Fat loss'];
      var gear = ['Gym','Home','Calisthenics'];
      var moves = { Chest:['Bench press','Incline press','Push-ups'], Back:['Deadlift','Barbell row','Lat pulldown'], Shoulders:['Overhead press','Lateral raise','Face pulls'], Arms:['EZ-bar curl','Hammer curl','Dips'], Core:['Knee raise','Ab wheel','Plank'], Quads:['Back squat','Leg press','Lunges'], Hamstrings:['RDL','Leg curl','Good morning'], Glutes:['Hip thrust','Split squat','Kickback'], Calves:['Calf raise','Jump rope','Farmer walk'], 'Hip flexors':['Leg raise','Mountain climbers','Knee drive'], Grip:['Farmer carry','Dead hang','Wrist curl'], Mobility:['World stretch','Thoracic rotation','Ankle rocks'] };

      function showFatal(details) { var box = document.getElementById('fatal'); if (box) { box.textContent = 'Symmetry could not render safely:\n' + String(details || 'Unknown error'); box.classList.add('show'); } }
      function notify(message) { var box = document.getElementById('toast'); if (!box) return; box.textContent = String(message); box.hidden = false; clearTimeout(box.timer); box.timer = setTimeout(function () { box.hidden = true; }, 2800); }
      function storage() { try { var probe = '__symmetry_probe__'; localStorage.setItem(probe, '1'); localStorage.removeItem(probe); return localStorage; } catch (error) { return { getItem:function (key) { return fallbackStore[key] || null; }, setItem:function (key,value) { fallbackStore[key] = String(value); }, removeItem:function (key) { delete fallbackStore[key]; } }; } }
      var store = storage();
      function initial() { return { version:7, page:'home', theme:'dark', profile:{name:'Athlete',goal:'Strength',equipment:'Gym'}, scan:{complete:false,photo:'',selected:[],weakest:[]}, plan:null, logs:[], daysDone:[], photos:[], measurements:[], xp:0, query:'', coachAnswer:'', restUntil:null, challengeCode:MARKER }; }
      function readState() { var base = initial(); try { var saved = JSON.parse(store.getItem(KEY) || 'null'); if (!saved || typeof saved !== 'object') return base; var result = Object.assign(base,saved); result.profile = Object.assign(base.profile,saved.profile || {}); result.scan = Object.assign(base.scan,saved.scan || {}); ['logs','daysDone','photos','measurements'].forEach(function (key) { if (!Array.isArray(result[key])) result[key] = []; }); if (!Array.isArray(result.scan.selected)) result.scan.selected = []; if (!pages.some(function (item) { return item[0] === result.page; })) result.page = 'home'; return result; } catch (error) { notify('Saved data was unreadable; opened a safe blank profile.'); return base; } }
      var state = readState();
      function save() { try { store.setItem(KEY,JSON.stringify(state)); } catch (error) { notify('Storage is unavailable; changes remain in this session.'); } }
      function esc(value) { return String(value == null ? '' : value).replace(/[&<>]/g,function (character) { return {'&':'&amp;','<':'&lt;','>':'&gt;'}[character]; }); }
      function today() { return new Date().toISOString().slice(0,10); }
      function level() { return Math.floor((Number(state.xp) || 0) / 500) + 1; }
      function streak() { var dates = new Set(state.logs.map(function (item) { return item.date; })); var count = 0; var date = new Date(); while (dates.has(date.toISOString().slice(0,10))) { count++; date.setDate(date.getDate() - 1); } return count; }
      function volume() { return state.logs.reduce(function (sum,item) { return sum + (Number(item.sets)||0) * (Number(item.reps)||0) * (Number(item.weight)||1); },0); }
      function planKey(week,day) { return week + '-' + day; }
      function buildPlan() { var selected = state.scan.selected.length ? state.scan.selected : ['Chest','Back','Core']; return { created:today(), weeks:Array.from({length:9},function (_,week) { return { focus:state.profile.goal, days:Array.from({length:7},function (_,day) { var recovery = day === 2 || day === 6; return { name:recovery ? 'Recovery / reflect' : 'Session ' + (day+1), rest:recovery, exercises:recovery ? [] : selected.slice(0,4).map(function (group,index) { var list = moves[group] || moves.Core; return { id:week+'-'+day+'-'+index, name:list[(week+day+index)%list.length], group:group, sets:state.profile.goal === 'Strength' ? 4 : 3, reps:state.profile.goal === 'Strength' ? 5 : 10, weight:0 }; }) }; }); }; }) }; }
      function ensurePlan() { if (!state.plan || !Array.isArray(state.plan.weeks)) { state.plan = buildPlan(); save(); } }
      function heading(kicker,title,subtitle) { return `<div class='section-head'><p class='eyebrow'>${esc(kicker)}</p><h2>${esc(title)}</h2><p class='muted'>${esc(subtitle)}</p></div>`; }
      function nav() { return `<header class='top'><button class='brand' data-page='home'><span class='mark'>S</span>SYMMETRY</button><div class='row'><span class='chip green'>Level ${level()}</span><button class='secondary' data-action='theme'>${state.theme === 'dark' ? '☼' : '☾'}</button></div></header>`; }
      function stats() { return `<div class='grid four'><article class='card stat'><span class='label'>Level</span><strong>${level()}</strong><small>local progression</small></article><article class='card stat'><span class='label'>Streak</span><strong>${streak()} days</strong><small>keep the chain alive</small></article><article class='card stat'><span class='label'>Total XP</span><strong>${state.xp}</strong><small>earned locally</small></article><article class='card stat'><span class='label'>Sessions</span><strong>${state.logs.length}</strong><small>${esc(state.profile.goal)} focus</small></article></div>`; }
      function home() { ensurePlan(); var last = state.logs[0]; return `<section class='page'><p class='eyebrow'>Private training system · local first</p><h1>Train with <em>intent.</em></h1><p class='lead'>A calm, adaptive record of the work you do. Start with a signal, follow the plan, and let the evidence compound.</p><div class='row'><button class='primary' data-page='${state.scan.complete ? 'plan' : 'scan'}'>${state.scan.complete ? 'Start today’s session' : 'Build your signal'} →</button><button class='ghost' data-page='progress'>View progress</button></div>${stats()}<div class='grid two'><article class='card accent'><p class='eyebrow'>Personal signal</p><h3>${state.scan.complete ? 'Your body map is ready' : 'Build your baseline'}</h3><p class='muted'>${state.scan.complete ? 'Priority: '+esc(state.scan.weakest.join(', '))+'. Your plan is tuned to this signal.' : 'Choose muscle groups and a goal. The deterministic local engine creates a useful 9-week starting point; no image leaves this browser.'}</p><button class='secondary' data-page='scan'>Review scan ↗</button></article><article class='card'><p class='eyebrow'>Latest evidence</p><h3>${esc(last ? last.exercise : 'No session logged yet')}</h3><p class='muted'>${last ? esc(last.sets+' sets · '+last.reps+' reps · '+(last.weight||0)+' kg') : 'Your first useful rep starts here.'}</p><div class='notice'>${state.daysDone.length ? 'Today is checked off. Return tomorrow.' : 'Log one honest working set today.'}</div></article></div></section>`; }
      function scan() { return `<section class='page'>${heading('01 / signal','Know your starting point','Choose what you notice or add a private photo. This is a planning aid, not a medical assessment.')}<div class='grid two'><article class='card'><p class='eyebrow'>Private input</p><h3>Photo signal</h3><label class='card' style='display:block;text-align:center;cursor:pointer' for='scan-photo'>${state.scan.photo ? `<img style='width:100%;max-height:230px;object-fit:cover' src='${state.scan.photo}' alt='Local scan preview'>` : '◌<br>Upload or take a body photo'}</label><input id='scan-photo' type='file' accept='image/*' hidden><p class='muted'>Images stay local. Or skip the camera and select groups.</p></article><article class='card'><div class='row'><h3>Choose your focus</h3><span class='chip green'>${state.scan.selected.length} selected</span></div><div class='tag-list'>${groups.map(function (group) { return `<button class='tag ${state.scan.selected.includes(group) ? 'selected' : ''}' data-group='${esc(group)}'>${esc(group)}</button>`; }).join('')}</div><div class='form-grid'><div class='field'><label>Goal</label><select id='scan-goal'>${goals.map(function (goal) { return `<option ${state.profile.goal === goal ? 'selected' : ''}>${goal}</option>`; }).join('')}</select></div><div class='field'><label>Equipment</label><select id='scan-gear'>${gear.map(function (item) { return `<option ${state.profile.equipment === item ? 'selected' : ''}>${item}</option>`; }).join('')}</select></div></div><div class='notice'>Identical inputs produce the same deterministic local plan.</div><button class='primary' data-action='generate'>Generate my 9-week plan →</button></article></div></section>`; }
      function plan() { ensurePlan(); var week = Math.min(8,state.week||0), day = Math.min(6,state.dayIndex||0), current = state.plan.weeks[week].days[day], done = state.daysDone.includes(planKey(week,day)); var exercises = current.rest ? `<div class='notice'>Recovery is part of the plan. Return tomorrow ready.</div>` : current.exercises.map(function (item) { return `<div class='exercise'><span>◉</span><span><b>${esc(item.name)}</b><small>${esc(item.group)} · ${item.sets} sets</small></span><input data-id='${item.id}' data-field='sets' type='number' min='1' value='${item.sets}'><input data-id='${item.id}' data-field='reps' type='number' min='1' value='${item.reps}'><input data-id='${item.id}' data-field='weight' type='number' min='0' step='.5' placeholder='kg'><button class='secondary log' data-id='${item.id}' data-name='${esc(item.name)}' data-group='${esc(item.group)}'>Log</button></div>`; }).join(''); return `<section class='page'>${heading('09-week program','Your plan, in motion','Log the work, return tomorrow, and let consistency do the heavy lifting.')}<div class='tabs'>${state.plan.weeks.map(function (_,index) { return `<button class='secondary ${index === week ? 'active' : ''}' data-week='${index}'>Week ${index+1}</button>`; }).join('')}</div><div class='weeks'>${state.plan.weeks[week].days.map(function (item,index) { return `<button class='week ${index === day ? 'current' : ''} ${state.daysDone.includes(planKey(week,index)) ? 'done' : ''}' data-day='${index}'><span class='label'>Day ${index+1}</span><h3>${esc(item.name)}</h3><small class='muted'>${item.rest ? 'Recovery' : item.exercises.length+' exercises'}</small></button>`; }).join('')}</div><div class='grid two'><article class='card'><p class='eyebrow'>Week ${week+1} / Day ${day+1}</p><h3>${esc(current.name)}</h3>${exercises}${current.rest ? '' : `<div class='row'><button class='primary' data-action='complete' ${done ? 'disabled' : ''}>${done ? 'Day checked off ✓' : 'Complete day +100 XP'}</button><button class='secondary' data-action='rest'>Start rest timer</button></div>`}</article><aside class='grid'><article class='card'><p class='eyebrow'>Rest timer</p><div id='timer' class='timer'>${state.restUntil ? '01:30' : '01:30'}</div><button class='secondary' data-action='rest'>Start 90 sec rest</button></article><article class='card'><p class='eyebrow'>Progressive overload</p><h3>Next useful step</h3><p class='muted'>Add one clean rep or the smallest load when the current work is crisp.</p></article></aside></div></section>`; }
      function progress() { var logs = state.logs.slice(0,10); var max = Math.max(1,...logs.map(function (item) { return Number(item.weight) || item.sets * item.reps; })); return `<section class='page'>${heading('Evidence over ego','Progress compounds','Photos, measurements, bodyweight, and training volume stay together, privately.')}<div class='grid four'><article class='card stat'><span class='label'>Volume</span><strong>${Math.round(volume())}</strong><small>local total</small></article><article class='card stat'><span class='label'>Photos</span><strong>${state.photos.length}</strong><small>private evidence</small></article><article class='card stat'><span class='label'>Measurements</span><strong>${state.measurements.length}</strong><small>check-ins</small></article><article class='card stat'><span class='label'>Badges</span><strong>${state.logs.length ? 1 : 0}</strong><small>earned locally</small></article></div><div class='grid two'><article class='card'><p class='eyebrow'>Training volume chart</p><div class='bars'>${logs.length ? logs.map(function (item) { var value = Number(item.weight) || item.sets * item.reps; return `<div class='bar' style='--height:${Math.max(8,Math.round(value/max*125))}px'></div>`; }).join('') : '<p class=\'muted\'>Log data to see this trend.</p>'}</div></article><article class='card'><p class='eyebrow'>Measurements</p><form id='measure-form' class='form-grid'><div class='field'><label>Metric</label><select name='metric'><option>Weight</option><option>Chest</option><option>Waist</option><option>Arm</option><option>Thigh</option></select></div><div class='field'><label>Value</label><input name='value' type='number' step='.1' min='0' required></div><button class='primary'>Save measurement</button></form>${state.measurements.slice(-5).reverse().map(function (item) { return `<div class='list-row'><span>${esc(item.metric)}</span><b>${esc(item.value)} · ${esc(item.date)}</b></div>`; }).join('')}</article></div><article class='card'><div class='row'><h3>Progress photos</h3><label class='secondary' for='progress-photo'>＋ Add photo</label></div><input id='progress-photo' type='file' accept='image/*' hidden><div class='photos'>${state.photos.slice(-6).reverse().map(function (item) { return `<div class='photo'><img src='${item.data}' alt='Progress photo'></div>`; }).join('')}</div></article></section>`; }
      function coach() { return `<section class='page'>${heading('AI coach / offline','Ask for a next step','No API, account, or upload. The response is deterministic and local.')}<div class='grid two'><article class='card'><form id='coach-form' class='form'><div class='field'><label>Question</label><textarea name='question' placeholder='e.g. How should I progress my pull-ups?' required></textarea></div><button class='primary'>Generate local reply ↗</button></form>${state.coachAnswer ? `<div class='notice'>${esc(state.coachAnswer)}</div>` : ''}</article><aside class='card'><p class='eyebrow'>Daily motivation</p><h3>Make today useful, not perfect.</h3><p class='muted'>Signal: ${state.scan.complete ? esc(state.scan.weakest.join(', ')) : 'scan not run'} · ${streak()} day streak.</p></aside></div><article class='card'><p class='eyebrow'>Share locally</p><h3>Challenge code</h3><p>${MARKER}</p><button class='secondary' data-action='copy'>Copy code</button></article></section>`; }
      function library() { var query = (state.query || '').toLowerCase(); var found = groups.flatMap(function (group) { return (moves[group] || []).map(function (move) { return [move,group]; }); }).filter(function (item) { return (item[0]+' '+item[1]).toLowerCase().includes(query); }); return `<section class='page'>${heading('Movement index','Choose your tool','An offline library of gym staples, home options, and skills.')}<article class='card'><input id='search' class='search' placeholder='Search movement or muscle' value='${esc(state.query)}'>${found.map(function (item) { return `<div class='list-row'><span><b>${esc(item[0])}</b><small class='muted'> · ${esc(item[1])}</small></span><span class='chip'>${esc(state.profile.equipment)}</span></div>`; }).join('')}</article></section>`; }
      function settings() { return `<section class='page'>${heading('Control the system','Your data, your device','Export portable JSON, import it later, and keep local-first control.')}<div class='grid two'><article class='card'><p class='eyebrow'>Preferences</p><form id='profile-form' class='form'><div class='field'><label>Name</label><input name='name' value='${esc(state.profile.name)}'></div><div class='form-grid'><div class='field'><label>Goal</label><select name='goal'>${goals.map(function (goal) { return `<option ${state.profile.goal === goal ? 'selected' : ''}>${goal}</option>`; }).join('')}</select></div><div class='field'><label>Equipment</label><select name='equipment'>${gear.map(function (item) { return `<option ${state.profile.equipment === item ? 'selected' : ''}>${item}</option>`; }).join('')}</select></div></div><button class='primary'>Save profile</button></form><button class='ghost' data-action='theme'>Switch to ${state.theme === 'dark' ? 'light' : 'dark'} mode</button></article><article class='card'><p class='eyebrow'>Portable local data</p><h3>Backup and restore</h3><p class='muted'>Includes plan, logs, photos, measurements, and settings. Storage key: ${KEY}</p><div class='row'><button class='primary' data-action='export'>Export JSON</button><label class='secondary' for='import-file'>Import JSON</label><input id='import-file' type='file' accept='application/json' hidden></div><p class='muted'>Marker: ${MARKER}</p></article></div></section>`; }
      function view() { return {home:home,scan:scan,plan:plan,progress:progress,coach:coach,library:library,settings:settings}[state.page](); }
      function render() { try { document.body.classList.toggle('light',state.theme === 'light'); document.getElementById('app').innerHTML = `<div class='app'><!-- ${MARKER} -->${nav()}<main>${view()}</main><nav class='bottom'>${pages.map(function (item) { return `<button class='${state.page === item[0] ? 'active' : ''}' data-page='${item[0]}'><span>${item[1]}</span>${item[2]}</button>`; }).join('')}</nav></div>`; } catch (error) { showFatal(error.stack || error); } }
      function fileData(file,done) { try { var reader = new FileReader(); reader.onload = function () { done(reader.result); }; reader.onerror = function () { notify('Could not read that file.'); }; reader.readAsDataURL(file); } catch (error) { notify('File access is unavailable.'); } }
      function rest() { state.restUntil = Date.now() + 90000; save(); render(); notify('Rest timer started.'); clearInterval(window.symmetryTimer); window.symmetryTimer = setInterval(function () { var timer = document.getElementById('timer'); var seconds = Math.max(0,Math.ceil((state.restUntil-Date.now())/1000)); if (timer) timer.textContent = String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0'); if (!seconds) { clearInterval(window.symmetryTimer); state.restUntil = null; save(); notify('Rest complete - ready when you are.'); } },250); }
      function log(button) { var row = button.closest('.exercise'); var entry = {date:today(),exercise:button.dataset.name,group:button.dataset.group,sets:Number(row.querySelector('[data-field=sets]').value)||1,reps:Number(row.querySelector('[data-field=reps]').value)||1,weight:Number(row.querySelector('[data-field=weight]').value)||0}; state.logs.unshift(entry); state.xp += 40; save(); render(); notify('Logged '+entry.exercise+' · +40 XP'); }
      function generate() { state.profile.goal = document.getElementById('scan-goal').value; state.profile.equipment = document.getElementById('scan-gear').value; state.scan.complete = true; state.scan.weakest = state.scan.selected.slice(-3); if (!state.scan.weakest.length) state.scan.weakest = ['Core','Mobility']; state.plan = buildPlan(); state.page = 'plan'; save(); render(); notify('Local scan complete. Your 9-week plan is ready.'); }
      function exportData() { var link = document.createElement('a'); link.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(state,null,2)); link.download = 'symmetry-backup-'+today()+'.json'; link.click(); notify('Backup exported.'); }
      function importData(file) { fileData(file,function (data) { try { var incoming = JSON.parse(data); if (!incoming || !incoming.version) throw new Error('missing version'); state = Object.assign(initial(),incoming); state.profile = Object.assign(initial().profile,incoming.profile || {}); state.scan = Object.assign(initial().scan,incoming.scan || {}); save(); render(); notify('Backup imported.'); } catch (error) { notify('That file is not a valid Symmetry backup.'); } }); }
      document.addEventListener('click',function (event) { var pageButton = event.target.closest('[data-page]'); var actionButton = event.target.closest('[data-action]'); var groupButton = event.target.closest('[data-group]'); var weekButton = event.target.closest('[data-week]'); var dayButton = event.target.closest('[data-day]'); var logButton = event.target.closest('.log'); if (pageButton) { state.page = pageButton.dataset.page; save(); render(); return; } if (groupButton) { var index = state.scan.selected.indexOf(groupButton.dataset.group); if (index < 0) state.scan.selected.push(groupButton.dataset.group); else state.scan.selected.splice(index,1); render(); return; } if (weekButton) { state.week = Number(weekButton.dataset.week); state.dayIndex = 0; render(); return; } if (dayButton) { state.dayIndex = Number(dayButton.dataset.day); render(); return; } if (logButton) { log(logButton); return; } if (!actionButton) return; var action = actionButton.dataset.action; if (action === 'theme') { state.theme = state.theme === 'dark' ? 'light' : 'dark'; save(); render(); } if (action === 'generate') generate(); if (action === 'rest') rest(); if (action === 'complete') { var key = planKey(state.week || 0,state.dayIndex || 0); if (!state.daysDone.includes(key)) { state.daysDone.push(key); state.xp += 100; save(); render(); notify('Day checked off · +100 XP'); } } if (action === 'export') exportData(); if (action === 'copy') { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(MARKER).then(function () { notify('Copied locally.'); }).catch(function () { notify(MARKER); }); else notify(MARKER); } });
      document.addEventListener('change',function (event) { if (event.target.id === 'scan-photo' && event.target.files[0]) fileData(event.target.files[0],function (data) { state.scan.photo = data; save(); render(); notify('Photo signal saved locally.'); }); if (event.target.id === 'progress-photo' && event.target.files[0]) fileData(event.target.files[0],function (data) { state.photos.push({date:today(),data:data}); save(); render(); notify('Progress photo saved locally.'); }); if (event.target.id === 'import-file' && event.target.files[0]) importData(event.target.files[0]); });
      document.addEventListener('input',function (event) { if (event.target.id === 'search') { state.query = event.target.value; clearTimeout(event.target.timer); event.target.timer = setTimeout(render,150); } });
      document.addEventListener('submit',function (event) { event.preventDefault(); var form = event.target; if (form.id === 'measure-form') { var value = Number(form.elements.value.value); if (value > 0) { state.measurements.push({date:today(),metric:form.elements.metric.value,value:value}); save(); render(); notify('Measurement saved locally.'); } } if (form.id === 'coach-form') { var question = String(form.elements.question.value || '').toLowerCase(); state.coachAnswer = question.includes('pull') ? 'Start with clean scapular pulls, then accumulate three quality sets of 3 to 8 reps. Keep one rep in reserve.' : 'Keep the next session focused on '+(state.scan.weakest[0] || 'your chosen priority')+'. Log one honest working set, then make the smallest progression available.'; save(); render(); } if (form.id === 'profile-form') { state.profile = {name:String(form.elements.name.value || 'Athlete').trim() || 'Athlete',goal:form.elements.goal.value,equipment:form.elements.equipment.value}; state.plan = null; save(); render(); notify('Profile saved.'); } });
      try { render(); } catch (error) { showFatal(error.stack || error); }
    }());
  </script>
</body>
</html>
